<div class="game">

<div id="identity" style="background:rgba(255,255,255,.97);border-radius:18px;padding:24px;margin-bottom:15px;border:1px solid #dbeafe">
<h1 style="margin-top:0;text-align:center">⭐ Tangkap Bintang</h1>
<p style="text-align:center;color:#64748b">Masukkan nama dan kelas sebelum bermain.</p>
<form id="identityForm">
<label style="display:block;font-weight:bold;margin:12px 0 6px">Nama</label>
<input id="nameInput" required maxlength="40" placeholder="Masukkan nama" style="width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px">
<label style="display:block;font-weight:bold;margin:12px 0 6px">Kelas</label>
<input id="classInput" required maxlength="30" placeholder="Contoh: XII IPA 1" style="width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px">
<button type="submit" style="width:100%;margin-top:16px;background:#2563eb;color:white;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:bold;cursor:pointer">Mulai Bermain 🎮</button>
</form>
</div>
<h1 id="title" style="display:none">⭐ Tangkap Bintang — Edisi Sekolah</h1>
<div id="gameContent" style="display:none"><div id="playerInfo" style="text-align:center;font-weight:bold;margin-bottom:10px"></div><div class="hud">
<span>⭐ Skor: <b id="score">0</b></span>
<span>❤️ Nyawa: <b id="lives">3</b></span>
<span>🏆 Tertinggi: <b id="best">0</b></span>
</div>
<div class="arena" id="arena">
<div class="player" id="player"></div>
</div>
<div class="controls">
<button id="left">◀ Kiri</button>
<button id="right">Kanan ▶</button>
</div>
<button class="start" id="start">Mulai Game</button>
<div class="msg" id="msg">Gunakan tombol ← → atau tombol di bawah.</div>
</div></div>

<script>

const player=document.getElementById("player");

const start=document.getElementById("start");
const identity=document.getElementById("identity");
const identityForm=document.getElementById("identityForm");
const gameContent=document.getElementById("gameContent");
const title=document.getElementById("title");
const playerInfo=document.getElementById("playerInfo");

const left=document.getElementById("left");
const right=document.getElementById("right");

let x=.5,score=0,lives=3,best=0,running=false,last=0,spawn=0,items=[],raf;

function update(){
 player.style.left=(x*100)+"%";
 scoreEl.textContent=score;
 livesEl.textContent=lives;
 bestEl.textContent=best;
}
function move(d){
 x=Math.max(.055,Math.min(.945,x+d));
 update();
}
function reset(){
 cancelAnimationFrame(raf);
 items.forEach(o=>o.el.remove());
 items=[];
 x=.5;score=0;lives=3;spawn=0;running=true;last=performance.now();
 start.textContent="Mulai Ulang";
 msg.textContent="Tangkap ⭐ dan hindari 💣!";
 update();
 raf=requestAnimationFrame(loop);
}
function createItem(){
 const el=document.createElement("div");
 el.className="item";
 const good=Math.random()<.78;
 el.textContent=good?"⭐":"💣";
 el.dataset.good=good?"1":"0";
 el.style.left=(5+Math.random()*90)+"%";
 arena.appendChild(el);
 items.push({el,y:-45,speed:130+Math.random()*100});
}
function collision(a,b){
 const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
 return A.left<B.right&&A.right>B.left&&A.top<B.bottom&&A.bottom>B.top;
}
function gameOver(){
 running=false;
 best=Math.max(best,score);
 update();
 msg.textContent="Game selesai! Skor kamu: "+score+" 🎮";
 start.textContent="Main Lagi";
}
function loop(t){
 if(!running)return;
 const dt=Math.min(.04,(t-last)/1000);
 last=t;
 spawn+=dt;
 if(spawn>.7){spawn=0;createItem();}
 items=items.filter(o=>{
  o.y+=o.speed*dt;
  o.el.style.transform="translateY("+o.y+"px)";
  if(collision(o.el,player)){
   if(o.el.dataset.good==="1") score++;
   else lives--;
   o.el.remove();
   update();
   if(lives<=0)gameOver();
   return false;
  }
  if(o.y>arena.clientHeight){o.el.remove();return false;}
  return true;
 });
 if(running)raf=requestAnimationFrame(loop);
}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"){e.preventDefault();move(-.055)}
 if(e.key==="ArrowRight"){e.preventDefault();move(.055)}
 if(e.key==="Enter"&&!running)reset();
});
left.onclick=()=>move(-.08);
right.onclick=()=>move(.08);
identityForm.addEventListener("submit",function(e){
 e.preventDefault();
 const name=document.getElementById("nameInput").value.trim();
 const cls=document.getElementById("classInput").value.trim();
 if(!name || !cls)return;
 identity.style.display="none";
 title.style.display="block";
 gameContent.style.display="block";
 playerInfo.textContent="Pemain: "+name+" • Kelas: "+cls;
 reset();
});
start.onclick=reset;
update();
</script>
</body>
</html>
